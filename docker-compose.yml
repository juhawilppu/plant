# Plant vitals stack.
#
#   caddy      TLS terminator for the origin, load balancer across the two API
#              instances; also owns the broker's certificate
#   postgres   Postgres 16, schema applied from db/schema.sql on first boot
#   mosquitto  MQTT broker the nodes publish to
#   server-a   the ingest + read API, with the MQTT->Postgres bridge inside it,
#   server-b   twice, so either can die without a dashboard noticing
#              (optional locally - see the `server` profile)
#   clickhouse a copy of the readings for the long-range views (roadmap 4.4)
#   cdc        streams new readings from Postgres's replication log into it
#   chaos      kills one of the two at random, to prove that claim (opt-in -
#              see the `chaos` profile and the README)
#
#   docker compose up -d postgres mosquitto        # deps only, run the API on the host
#   docker compose --profile server up -d --build  # everything in Docker (production)

# One definition for both API instances; they differ only in name and port.
x-server: &server
  profiles: ['server']
  build: ./server
  # Named, so both instances run the one image rather than building two.
  image: plant-vitals-server
  restart: unless-stopped
  environment: &server-env
    # Inside the compose network the host is the service name, not localhost.
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/plant_vitals
    INGEST_TOKEN: ${INGEST_TOKEN}
    PORT: 8090
    # Inside the compose network the broker is reachable by service name, so
    # the bridge never goes out over the public interface.
    MQTT_URL: mqtt://mosquitto:1883
    MQTT_USERNAME: bridge
    MQTT_PASSWORD: ${MQTT_BRIDGE_PASSWORD}
    # The history endpoint reads from here, and falls back to Postgres when it
    # cannot, so this is deliberately not in depends_on.
    CLICKHOUSE_URL: http://clickhouse:8123
    CLICKHOUSE_USER: plant
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-plant}
  volumes:
    # The dashboard is built on the developer's machine and rsynced, so it is
    # mounted rather than baked into the image: a UI change needs a sync and a
    # restart, not a rebuild. index.js resolves ../web/dist from /app.
    - ./web/dist:/web/dist:ro
  # An instance measured 30-40 MB through a chaos run. Two of these plus
  # Postgres, the broker and Caddy share 961 MB, so the cap is well under the
  # 256 MB the single instance used to get, and still four times what it uses.
  mem_limit: 160m
  # /health fails while an instance cannot hear new readings, not just while
  # it cannot reach Postgres. deploy.sh waits on this before moving to the
  # next instance, and the chaos monkey only strikes while both pass it.
  healthcheck:
    test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/health']
    interval: 5s
    timeout: 3s
    retries: 2
    start_period: 15s
  labels:
    plant-vitals.chaos: target
  depends_on:
    postgres:
      condition: service_healthy
    mosquitto:
      condition: service_started

services:
  postgres:
    image: postgres:16-alpine
    container_name: plant-vitals-postgres
    restart: unless-stopped
    # Logical decoding, for the cdc service's replication slot. A slot makes
    # Postgres keep every WAL segment its consumer has not confirmed, so a dead
    # consumer would fill the disk; past this cap Postgres gives up on the slot
    # instead, and cdc.js starts over with a full copy. The disk has ~19 GB free.
    command: ['postgres', '-c', 'wal_level=logical', '-c', 'max_slot_wal_keep_size=1GB']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: plant_vitals
    ports:
      # Bound to loopback ONLY. On the server this file runs on a public IP, and
      # a plain '55433:5432' would publish Postgres to the internet. Local
      # development still reaches it on localhost:55433 exactly as before.
      # 5432 and 55432 are usually taken by other local Postgres instances.
      - '127.0.0.1:55433:5432'
    volumes:
      - plant-vitals-pgdata:/var/lib/postgresql/data
      # Applied only when the data volume is empty, i.e. on first boot.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d plant_vitals']
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: plant-vitals-mosquitto
    restart: unless-stopped
    # ONLY the TLS port is published. 1883 still listens inside the container
    # for the bridge on the compose network, but it is no longer reachable from
    # the internet, so no MQTT password ever crosses the network in the clear.
    ports:
      - '8883:8883'
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/certs:/mosquitto/certs:ro
      - plant-vitals-mqttdata:/mosquitto/data
    # A 1 GB box with only a small swapfile: cap the broker so a runaway client cannot starve
    # Postgres. Mosquitto idles at a few MB, so this is generous.
    mem_limit: 96m

  server-a:
    <<: *server
    container_name: plant-vitals-server-a
    environment:
      <<: *server-env
      INSTANCE: a
    ports:
      # Loopback only. In production Caddy is the only thing that talks to the
      # instances, over the compose network; the host bindings are kept so
      # deploy.sh and a person on the box can reach each one directly without
      # going out through Cloudflare.
      - '127.0.0.1:${WEB_PORT:-8090}:8090'

  server-b:
    <<: *server
    container_name: plant-vitals-server-b
    environment:
      <<: *server-env
      INSTANCE: b
    ports:
      - '127.0.0.1:${WEB_PORT_B:-8091}:8090'

  # A second store for the long-range views, fed by cdc below. It has to fit on
  # the same 961 MB box as everything else, and no more memory is coming:
  # clickhouse/config.d holds what that costs.
  clickhouse:
    profiles: ['server']
    image: clickhouse/clickhouse-server:26.8-alpine
    container_name: plant-vitals-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: plant_vitals
      # Replaces the passwordless `default` user, which would otherwise be open
      # to every container on the compose network.
      CLICKHOUSE_USER: plant
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-plant}
    ports:
      # Loopback only, for a person on the box: curl localhost:58123.
      - '127.0.0.1:58123:8123'
    volumes:
      - plant-vitals-chdata:/var/lib/clickhouse
      - ./clickhouse/config.d/low-memory.xml:/etc/clickhouse-server/config.d/low-memory.xml:ro
      - ./clickhouse/users.d/low-memory.xml:/etc/clickhouse-server/users.d/low-memory.xml:ro
      # Applied only when the data volume is empty, like db/schema.sql.
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # The budget, not a guess at usage: ClickHouse sizes its own ceiling from
    # this (max_server_memory_usage_to_ram_ratio) and fails queries past it.
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8123/ping']
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  # Postgres -> ClickHouse. One instance: a replication slot takes one consumer
  # at a time. It runs the API's image, built by server-a/server-b's `build`.
  cdc:
    profiles: ['server']
    image: plant-vitals-server
    container_name: plant-vitals-cdc
    restart: unless-stopped
    command: ['node', 'cdc.js']
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/plant_vitals
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: plant
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-plant}
    mem_limit: 96m
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: plant-vitals-caddy
    restart: unless-stopped
    # The only two ports open to the world. 80 is not merely a redirect: it is
    # how Cloudflare reaches the origin on a Flexible zone, and how the ACME
    # HTTP-01 challenge arrives.
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # The directory, not the file. rsync replaces the Caddyfile rather than
      # rewriting it, and a single-file mount would keep showing Caddy the old
      # one; through the directory, deploy.sh's `caddy reload` sees the new.
      - ./caddy:/etc/caddy:ro
      - plant-vitals-caddydata:/data
      - plant-vitals-caddyconfig:/config
    mem_limit: 128m
    depends_on:
      - server-a
      - server-b

  # The chaos monkey. Every few minutes, and only while both API instances are
  # healthy, it kills one at random - SIGKILL or SIGTERM, a crash or a clean
  # stop - and brings it back a little later. chaos/check.mjs is how to tell
  # whether the dashboards noticed.
  #
  #   docker compose --profile server --profile chaos up -d chaos    # release it
  #   docker compose --profile server --profile chaos rm -sf chaos   # call it off
  #
  # Both profiles, because Caddy depends on the instances and compose refuses
  # the whole file when it cannot see them. Naming chaos only starts chaos.
  #
  # It drives Docker through the host's socket, which is root on the host in
  # all but name. Acceptable for something with no ports that only runs when
  # asked to, but that is why it is behind a profile of its own.
  chaos:
    profiles: ['chaos']
    image: docker:27-cli
    container_name: plant-vitals-chaos
    restart: unless-stopped
    entrypoint: ['sh', '/chaos/monkey.sh']
    environment:
      CHAOS_MIN_S: ${CHAOS_MIN_S:-120}
      CHAOS_MAX_S: ${CHAOS_MAX_S:-600}
      CHAOS_DOWN_S: ${CHAOS_DOWN_S:-20}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./chaos:/chaos:ro
    mem_limit: 32m

volumes:
  plant-vitals-pgdata:
  plant-vitals-mqttdata:
  plant-vitals-caddydata:
  plant-vitals-caddyconfig:
  plant-vitals-chdata:
