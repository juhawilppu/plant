# Mosquitto for the plant nodes.
#
# The broker is reachable from the internet, because the node has to reach it
# from the house. So anonymous access is off and every client authenticates.
# The password file is generated on first deploy (see deploy.sh) and is NOT in
# git.

# Plaintext, and NOT published to the host by docker-compose: only the bridge
# on the compose network reaches this. Nothing unencrypted leaves the box.
listener 1883
protocol mqtt

allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Survives a broker restart, so a retained status/reading is still there
# afterwards and the dashboard is not blank until the next node cycle.
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
# Connection churn is the thing worth seeing in the log when a node misbehaves.
connection_messages true

# The TLS listener on 8883 lives in conf.d/tls.conf, written by deploy.sh once
# the certificate exists. Kept separate because Mosquitto refuses to start if a
# listener names a certificate file that is not there yet, and this way the
# first deploy - which is also the one that obtains the certificate - does not
# have to be a special case.
include_dir /mosquitto/config/conf.d
